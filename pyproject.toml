[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanova"
dynamic = ["version"]
description = "URBANOVA Phase 1 analysis engine: evidence-based environmental decision support for a development site"
readme = "docs/HANDOFF.md"
requires-python = ">=3.11,<3.13"
license = "LicenseRef-URBANOVA-Proprietary"
# The analysis engine (urbanova.engine). Versions are the ones tested; see requirements.txt for exact pins.
dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic>=2.12,<3",
    "shapely>=2.1,<2.2",
    "pyproj>=3.7,<3.8",
    "numpy>=2.3,<2.4",
    "rasterio>=1.4,<1.5",
    "pillow>=11.3,<12",
    "matplotlib>=3.10,<3.11",
    "pypdf>=6.2,<7",
    "ezdxf>=1.4,<1.5",
    "pythermalcomfort>=4.6.2,<4.7",
    "scikit-learn>=1.9.1,<1.10",
]

[project.optional-dependencies]
# The prototype web app (reference demo only; not the integration target).
app = ["fastapi>=0.135,<0.136", "uvicorn>=0.41,<0.42", "python-multipart>=0.0.22,<0.1", "reportlab>=5.1,<5.2"]
test = ["pytest>=9.1,<10", "pymannkendall==1.4.3"]  # pymannkendall: independent reference for the trend tests (MIT, 2023-01-14)

[project.scripts]
urbanova-engine = "urbanova.engine.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "urbanova.__version__" }

[tool.setuptools.packages.find]
include = ["urbanova*"]

[tool.setuptools.package-data]
urbanova = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
